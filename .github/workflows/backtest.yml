name: Strategy backtest
# Free, key-less backtest of AlphaStrategy on public Binance candles.
# No secrets, no model calls, no trading. Runs on demand or when the backtester changes.
'on':
  workflow_dispatch:
  push:
    paths:
    - src/backtest/**
    - .github/workflows/backtest.yml
permissions:
  contents: read
concurrency:
  group: strategy-backtest-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backtest:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - name: Install backtest dependencies
      run: python -m pip install --disable-pip-version-check pandas==2.2.3 numpy==2.1.3 pytest==8.3.4
    - name: Test the engine
      run: python -m pytest tests/test_backtest.py -q -o addopts=""
    - name: Run the backtest
      run: |
        python -m src.backtest.run --data-dir "$RUNNER_TEMP/candles" --out "$RUNNER_TEMP/out"
        cat "$RUNNER_TEMP/out/results.md" >> "$GITHUB_STEP_SUMMARY"
