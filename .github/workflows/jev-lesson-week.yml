name: Frozen Jev lesson week
on:
  schedule:
    - cron: '30 6 25 10 *'
  workflow_dispatch:
    inputs:
      mode:
        description: Verify encrypted snapshot only, or execute the one frozen future run
        required: true
        default: verify
        type: choice
        options: [verify, run]
permissions: {}
concurrency:
  group: frozen-jev-lesson-week-v2
  cancel-in-progress: false
jobs:
  research:
    if: github.repository == 'Daniel-eldick/neural-edge' && github.ref == 'refs/heads/develop' && github.actor == 'Daniel-eldick'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: jev-lesson-week
    permissions:
      contents: write
      actions: write
    steps:
      - name: Check out the hosted controller
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up the pinned Python runtime
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.13'
      - name: Install only the research transport dependencies
        run: python -m pip install --disable-pip-version-check -r deploy/research/runtime.txt
      - name: Verify or run the encrypted frozen experiment
        env:
          GH_TOKEN: ${{ github.token }}
          JEV_RESEARCH_ENVELOPE_KEY: ${{ secrets.JEV_RESEARCH_ENVELOPE_KEY }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          REQUESTED_MODE: ${{ inputs.mode || 'run' }}
        run: python -m deploy.research.cloud "$REQUESTED_MODE" --directory deploy/research/frozen-week
      - name: Stop future scheduled attempts after the execution date
        if: always() && (github.event_name == 'schedule' || inputs.mode == 'run')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(date -u +%s)" -ge 1792909800 ]; then
            gh api --method PUT repos/Daniel-eldick/neural-edge/actions/workflows/jev-lesson-week.yml/disable
          fi
  private_summary:
    needs: research
    if: always() && github.repository == 'Daniel-eldick/neural-edge' && github.ref == 'refs/heads/develop' && github.actor == 'Daniel-eldick' && needs.research.result != 'skipped'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: jev-lesson-week
    permissions:
      contents: read
    steps:
      - name: Check out only the summary controller
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up the pinned Python runtime
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.13'
      - name: Install only the research transport dependencies
        run: python -m pip install --disable-pip-version-check -r deploy/research/runtime.txt
      - name: Generate and deliver the private summary without inference
        env:
          GH_TOKEN: ${{ github.token }}
          JEV_RESEARCH_ENVELOPE_KEY: ${{ secrets.JEV_RESEARCH_ENVELOPE_KEY }}
          JEV_RESEARCH_REPORT_DEPLOY_KEY: ${{ secrets.JEV_RESEARCH_REPORT_DEPLOY_KEY }}
          REQUESTED_MODE: ${{ inputs.mode || 'run' }}
        run: python -m deploy.research.summary "$REQUESTED_MODE" --directory deploy/research/frozen-week
  learning:
    needs: [research, private_summary]
    if: always() && github.repository == 'Daniel-eldick/neural-edge' && github.ref == 'refs/heads/develop' && github.actor == 'Daniel-eldick' && needs.research.result != 'skipped'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: jev-lesson-week
    permissions:
      contents: write
    steps:
      - name: Check out the isolated learning controller
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up the pinned Python runtime
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.13'
      - name: Install only the research transport dependencies
        run: python -m pip install --disable-pip-version-check -r deploy/research/runtime.txt
      - name: Restore learning funding from protected secrets
        env:
          JEV_LEARNING_BUNDLE_1: ${{ secrets.JEV_LEARNING_BUNDLE_1 }}
          JEV_LEARNING_BUNDLE_2: ${{ secrets.JEV_LEARNING_BUNDLE_2 }}
        run: |
          python - <<'PY'
          import base64, hashlib, json, os
          from pathlib import Path
          directory = Path('deploy/research/learning-week')
          config = json.loads((directory / 'runner.json').read_text())
          sealed = base64.b64decode(os.environ['JEV_LEARNING_BUNDLE_1'] + os.environ['JEV_LEARNING_BUNDLE_2'], validate=True)
          if len(sealed) > 128000 or sealed[:4] != b'JEV1' or hashlib.sha256(sealed).hexdigest() != config['input_sha256']:
              raise SystemExit('Private learning funding binding differs; no request allowed')
          target = directory / 'input.enc'
          with target.open('xb') as output:
              target.chmod(0o600)
              output.write(sealed)
          print('Private learning funding restored without public export')
          PY
      - name: Review completed evidence and save an unproven candidate
        env:
          GH_TOKEN: ${{ github.token }}
          JEV_RESEARCH_ENVELOPE_KEY: ${{ secrets.JEV_RESEARCH_ENVELOPE_KEY }}
          JEV_RESEARCH_REPORT_DEPLOY_KEY: ${{ secrets.JEV_RESEARCH_REPORT_DEPLOY_KEY }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          REQUESTED_MODE: ${{ inputs.mode || 'run' }}
        run: python -m deploy.research.learning "$REQUESTED_MODE" --directory deploy/research/frozen-week --funding deploy/research/learning-week
  completion:
    needs: [research, private_summary, learning]
    if: always() && github.repository == 'Daniel-eldick/neural-edge' && github.ref == 'refs/heads/develop' && github.actor == 'Daniel-eldick' && needs.research.result != 'skipped' && (github.event_name == 'schedule' || inputs.mode == 'run')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Notify the owner without publishing private results
        env:
          GH_TOKEN: ${{ github.token }}
          RESEARCH_STATUS: ${{ needs.research.result }}
          SUMMARY_STATUS: ${{ needs.private_summary.result }}
          LEARNING_STATUS: ${{ needs.learning.result }}
          RESEARCH_RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$(date -u +%s)" -lt 1792909800 ]; then
            exit 0
          fi
          case "$RESEARCH_STATUS" in
            success|failure|cancelled) ;;
            *) exit 1 ;;
          esac
          case "$SUMMARY_STATUS" in
            success|failure|cancelled|skipped) ;;
            *) exit 1 ;;
          esac
          case "$LEARNING_STATUS" in
            success|failure|cancelled|skipped) ;;
            *) exit 1 ;;
          esac
          case "$RESEARCH_RUN_ID" in
            ''|*[!0-9]*) exit 1 ;;
          esac
          notice=$(printf '%s\n' \
            '@Daniel-eldick The scheduled research execution attempt has finished.' \
            "Research job status: $RESEARCH_STATUS." \
            "Run: https://github.com/Daniel-eldick/neural-edge/actions/runs/$RESEARCH_RUN_ID" \
            '' \
            "Private report delivery job: $SUMMARY_STATUS." \
            "Candidate lesson review job: $LEARNING_STATUS." \
            'Private report: https://github.com/Daniel-eldick/jev-research-results/blob/reports/README.md (sign in as the owner).' \
            'Private candidate lessons: https://github.com/Daniel-eldick/jev-research-results/tree/reports/lessons (unproven, never automatically promoted).' \
            'The report may be inconclusive or unavailable after a failed execution or delivery. Detailed results are never posted in this public notice.' \
            'A failure or cancellation may leave the result unavailable; the existing budget hold remains until private accounting is verified. No paid retry is triggered by this notice.')
          gh api --method POST repos/Daniel-eldick/neural-edge/issues/6/comments \
            -f body="$notice" --jq .html_url

  freeze_fresh:
    needs:
    - learning
    if: always() && github.repository == 'Daniel-eldick/neural-edge' && github.ref ==
      'refs/heads/develop' && github.actor == 'Daniel-eldick' && needs.learning.result
      == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: jev-lesson-week
    permissions:
      contents: read
    steps:
    - name: Check out the isolated learning controller
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
    - name: Set up the pinned Python runtime
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: 3.12.13
    - name: Install only the research transport dependencies
      run: python -m pip install --disable-pip-version-check -r deploy/research/runtime.txt
    - name: Restore private fresh funding
      env:
        JEV_FRESH_BUNDLE_1: ${{ secrets.JEV_FRESH_BUNDLE_1 }}
        JEV_FRESH_BUNDLE_2: ${{ secrets.JEV_FRESH_BUNDLE_2 }}
      run: "python - <<'PY'\nimport base64, hashlib, json, os\nfrom pathlib import Path\n\
        directory = Path('deploy/research/fresh-week')\nconfig = json.loads((directory\
        \ / 'runner.json').read_text())\nsealed = base64.b64decode(os.environ['JEV_FRESH_BUNDLE_1']\
        \ + os.environ['JEV_FRESH_BUNDLE_2'], validate=True)\nif len(sealed) > 128000\
        \ or sealed[:4] != b'JEV1' or hashlib.sha256(sealed).hexdigest() != config['input_sha256']:\n\
        \    raise SystemExit('Private fresh input binding differs; no request allowed')\n\
        target = directory / 'input.enc'\nwith target.open('xb') as output:\n    target.chmod(0o600)\n\
        \    output.write(sealed)\nprint('Private fresh input restored without public\
        \ export')\nPY\n"
    - name: Restore original learning funding for authentication
      env:
        JEV_LEARNING_BUNDLE_1: ${{ secrets.JEV_LEARNING_BUNDLE_1 }}
        JEV_LEARNING_BUNDLE_2: ${{ secrets.JEV_LEARNING_BUNDLE_2 }}
      run: "python - <<'PY'\nimport base64, hashlib, json, os\nfrom pathlib import Path\n\
        directory = Path('deploy/research/learning-week')\nconfig = json.loads((directory\
        \ / 'runner.json').read_text())\nsealed = base64.b64decode(os.environ['JEV_LEARNING_BUNDLE_1']\
        \ + os.environ['JEV_LEARNING_BUNDLE_2'], validate=True)\nif len(sealed) > 128000\
        \ or sealed[:4] != b'JEV1' or hashlib.sha256(sealed).hexdigest() != config['input_sha256']:\n\
        \    raise SystemExit('Private fresh input binding differs; no request allowed')\n\
        target = directory / 'input.enc'\nwith target.open('xb') as output:\n    target.chmod(0o600)\n\
        \    output.write(sealed)\nprint('Private fresh input restored without public\
        \ export')\nPY\n"
    - name: Bind the saved candidate before fresh data exists
      env:
        GH_TOKEN: ${{ github.token }}
        JEV_RESEARCH_ENVELOPE_KEY: ${{ secrets.JEV_RESEARCH_ENVELOPE_KEY }}
        JEV_RESEARCH_REPORT_DEPLOY_KEY: ${{ secrets.JEV_RESEARCH_REPORT_DEPLOY_KEY }}
        REQUESTED_MODE: ${{ inputs.mode == 'verify' && 'verify' || 'freeze' }}
      run: python -m deploy.research.followup "$REQUESTED_MODE" --directory deploy/research/frozen-week
        --funding deploy/research/fresh-week
