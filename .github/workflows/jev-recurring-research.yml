name: Recurring Jev research
'on':
  schedule:
  - cron: 17 7 * * *
  workflow_dispatch:
    inputs:
      mode:
        description: Verify transport without inference, or wake the calendar-bound recurring controller
        required: true
        default: verify
        type: choice
        options:
        - verify
        - tick
permissions: {}
concurrency:
  group: recurring-jev-research-v1
  cancel-in-progress: false
jobs:
  research:
    if: github.repository == 'Daniel-eldick/neural-edge' && github.ref == 'refs/heads/develop' && github.actor
      == 'Daniel-eldick'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: jev-lesson-week
    permissions:
      contents: read
    steps:
    - name: Check out the isolated learning controller
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
    - name: Set up the pinned Python runtime
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: 3.12.13
    - name: Install only the research transport dependencies
      run: python -m pip install --disable-pip-version-check -r deploy/research/runtime.txt
    - name: Restore the existing privately funded snapshot for source verification
      env:
        JEV_FRESH_BUNDLE_1: ${{ secrets.JEV_FRESH_BUNDLE_1 }}
        JEV_FRESH_BUNDLE_2: ${{ secrets.JEV_FRESH_BUNDLE_2 }}
      run: "python - <<'PY'\nimport base64, hashlib, json, os\nfrom pathlib import Path\ndirectory = Path('deploy/research/fresh-week')\n\
        config = json.loads((directory / 'runner.json').read_text())\nsealed = base64.b64decode(os.environ['JEV_FRESH_BUNDLE_1']\
        \ + os.environ['JEV_FRESH_BUNDLE_2'], validate=True)\nif len(sealed) > 128000 or sealed[:4] !=\
        \ b'JEV1' or hashlib.sha256(sealed).hexdigest() != config['input_sha256']:\n    raise SystemExit('Private\
        \ fresh input binding differs; no request allowed')\ntarget = directory / 'input.enc'\nwith target.open('xb')\
        \ as output:\n    target.chmod(0o600)\n    output.write(sealed)\nprint('Private fresh input restored\
        \ without public export')\nPY\n"
    - name: Verify recurring research
      if: (inputs.mode || 'tick') == 'verify'
      env:
        JEV_RESEARCH_ENVELOPE_KEY: ${{ secrets.JEV_RESEARCH_ENVELOPE_KEY }}
        JEV_RESEARCH_REPORT_DEPLOY_KEY: ${{ secrets.JEV_RESEARCH_REPORT_DEPLOY_KEY }}
      run: python -m deploy.research.loop verify
    - name: Tick recurring research
      if: (inputs.mode || 'tick') == 'tick'
      env:
        JEV_RESEARCH_ENVELOPE_KEY: ${{ secrets.JEV_RESEARCH_ENVELOPE_KEY }}
        JEV_RESEARCH_REPORT_DEPLOY_KEY: ${{ secrets.JEV_RESEARCH_REPORT_DEPLOY_KEY }}
        TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
      run: 'set -euo pipefail

        status=$(python -m deploy.research.loop tick)

        case "$status" in waiting_for_first_review|missed_freeze_wait_next_week|waiting_or_phase_already_claimed_no_retry|candidate_frozen_before_fresh_data|fresh_test_complete_original|fresh_test_complete_candidate)
        ;; *) exit 1 ;; esac

        printf ''%s\n'' "$status"

        printf ''status=%s\n'' "$status" >> "$GITHUB_OUTPUT"

        '
      id: tick
    outputs:
      status: ${{ steps.tick.outputs.status }}
  keep_schedule:
    needs:
    - research
    if: always() && needs.research.result != 'skipped' && (github.event_name == 'schedule' || inputs.mode
      == 'tick') && github.repository == 'Daniel-eldick/neural-edge' && github.ref == 'refs/heads/develop'
      && github.actor == 'Daniel-eldick'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
    - name: Keep the public research schedule active without changing source
      env:
        GH_TOKEN: ${{ github.token }}
      run: "python - <<'PYCODE'\nimport datetime, json, subprocess\nrepo = 'repos/Daniel-eldick/neural-edge/'\n\
        def api(path, method='GET', value=None):\n    args = ['gh', 'api', repo+path, '--method', method]\n\
        \    if value is not None: args += ['--input', '-']\n    result = subprocess.run(args, input=json.dumps(value)\
        \ if value is not None else None,\n                            text=True, capture_output=True,\
        \ check=True, timeout=30)\n    return json.loads(result.stdout)\nref = api('git/ref/heads/develop')['object']['sha']\n\
        commit = api('git/commits/'+ref)\nnow = datetime.datetime.now(datetime.timezone.utc)\nthen = datetime.datetime.fromisoformat(commit['committer']['date'].replace('Z','+00:00'))\n\
        if (now-then).total_seconds() >= 28*86400:\n    new = api('git/commits','POST', {'message':'Maintain\
        \ authorized hosted research schedule',\n                                  'tree':commit['tree']['sha'],\
        \ 'parents':[ref]})\n    api('git/refs/heads/develop','PATCH', {'sha':new['sha'],'force':False})\n\
        \    print('Schedule liveness maintained; source tree unchanged')\nelse:\n    print('Recent repository\
        \ activity; no liveness commit required')\nPYCODE\n"
  failure_notice:
    needs:
    - research
    - keep_schedule
    if: always() && (needs.research.result == 'failure' || needs.keep_schedule.result == 'failure') &&
      (github.event_name == 'schedule' || inputs.mode == 'tick') && github.repository == 'Daniel-eldick/neural-edge'
      && github.ref == 'refs/heads/develop' && github.actor == 'Daniel-eldick'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
    - name: Notify owner of a stopped research wake without private data
      env:
        GH_TOKEN: ${{ github.token }}
      run: 'gh api --method POST repos/Daniel-eldick/neural-edge/issues/6/comments -f body=''@Daniel-eldick
        A recurring Jev research wake stopped safely. Inspect the private status at https://github.com/Daniel-eldick/jev-research-results/blob/reports/loop-v1/README.md
        . Uncertain phases retain their full budget reservation and will not retry. Detailed findings
        and costs remain private.'' --jq .html_url

        '
  completion_notice:
    needs:
    - research
    if: needs.research.result == 'success' && startsWith(needs.research.outputs.status, 'fresh_test_complete_')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
    - name: Notify owner that a fresh weekly test has finished
      env:
        GH_TOKEN: ${{ github.token }}
      run: 'gh api --method POST repos/Daniel-eldick/neural-edge/issues/6/comments -f body=''@Daniel-eldick
        A recurring fresh Jev test has finished. Completed trades, costs, the adoption verdict and reasons
        are private: https://github.com/Daniel-eldick/jev-research-results/blob/reports/loop-v1/README.md
        . The next weekly cycle uses the approved incumbent automatically within the same guarded monthly
        allowance.'' --jq .html_url

        '
