name: Strategy search
# Free, key-less search over a fixed list of textbook strategies on public Binance candles.
# No secrets, no model calls, no trading.
'on':
  workflow_dispatch:
  push:
    paths:
    - src/backtest/search.py
    - .github/workflows/strategy-search.yml
permissions:
  contents: read
concurrency:
  group: strategy-search-${{ github.ref }}
  cancel-in-progress: true
jobs:
  search:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - name: Install dependencies
      run: python -m pip install --disable-pip-version-check pandas==2.2.3 numpy==2.1.3 pytest==8.3.4
    - name: Test the harness
      run: python -m pytest tests/test_search.py -q -o addopts=""
    - name: Run the search
      run: |
        python -m src.backtest.search --data-dir "$RUNNER_TEMP/candles" --out "$RUNNER_TEMP/out"
        cat "$RUNNER_TEMP/out/search.md" >> "$GITHUB_STEP_SUMMARY"
