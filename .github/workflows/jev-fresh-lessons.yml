name: Fresh Jev candidate replay
'on':
  schedule:
  - cron: 30 6 31 10 *
  workflow_dispatch:
    inputs:
      mode:
        description: Verify private transport or execute one fixed fresh comparison
        required: true
        default: verify
        type: choice
        options:
        - verify
        - run
permissions: {}
concurrency:
  group: fresh-jev-lesson-v1
  cancel-in-progress: false
jobs:
  fresh:
    if: github.repository == 'Daniel-eldick/neural-edge' && github.ref == 'refs/heads/develop'
      && github.actor == 'Daniel-eldick'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: jev-lesson-week
    permissions:
      contents: write
      actions: write
    steps:
    - name: Check out the isolated learning controller
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
    - name: Set up the pinned Python runtime
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: 3.12.13
    - name: Install only the research transport dependencies
      run: python -m pip install --disable-pip-version-check -r deploy/research/runtime.txt
    - name: Restore private fresh funding
      env:
        JEV_FRESH_BUNDLE_1: ${{ secrets.JEV_FRESH_BUNDLE_1 }}
        JEV_FRESH_BUNDLE_2: ${{ secrets.JEV_FRESH_BUNDLE_2 }}
      run: "python - <<'PY'\nimport base64, hashlib, json, os\nfrom pathlib import\
        \ Path\ndirectory = Path('deploy/research/fresh-week')\nconfig = json.loads((directory\
        \ / 'runner.json').read_text())\nsealed = base64.b64decode(os.environ['JEV_FRESH_BUNDLE_1']\
        \ + os.environ['JEV_FRESH_BUNDLE_2'], validate=True)\nif len(sealed) > 128000\
        \ or sealed[:4] != b'JEV1' or hashlib.sha256(sealed).hexdigest() != config['input_sha256']:\n\
        \    raise SystemExit('Private fresh input binding differs; no request allowed')\n\
        target = directory / 'input.enc'\nwith target.open('xb') as output:\n    target.chmod(0o600)\n\
        \    output.write(sealed)\nprint('Private fresh input restored without public\
        \ export')\nPY\n"
    - name: Verify or run the fixed fresh comparison
      env:
        GH_TOKEN: ${{ github.token }}
        JEV_RESEARCH_ENVELOPE_KEY: ${{ secrets.JEV_RESEARCH_ENVELOPE_KEY }}
        JEV_RESEARCH_REPORT_DEPLOY_KEY: ${{ secrets.JEV_RESEARCH_REPORT_DEPLOY_KEY
          }}
        REQUESTED_MODE: ${{ inputs.mode || 'run' }}
        TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
      run: python -m deploy.research.followup "$REQUESTED_MODE" --directory deploy/research/frozen-week
        --funding deploy/research/fresh-week
    - name: Disable future scheduled attempts
      if: always() && (github.event_name == 'schedule' || inputs.mode == 'run')
      env:
        GH_TOKEN: ${{ github.token }}
      run: "if [ \"$(date -u +%s)\" -ge 1793428200 ]; then\n  gh api --method PUT\
        \ repos/Daniel-eldick/neural-edge/actions/workflows/jev-fresh-lessons.yml/disable\n\
        fi\n"
  completion:
    needs:
    - fresh
    if: always() && github.repository == 'Daniel-eldick/neural-edge' && github.ref
      == 'refs/heads/develop' && github.actor == 'Daniel-eldick' && needs.fresh.result
      != 'skipped' && (github.event_name == 'schedule' || inputs.mode == 'run')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
    - name: Notify owner with a private report link
      env:
        GH_TOKEN: ${{ github.token }}
        FRESH_STATUS: ${{ needs.fresh.result }}
        FRESH_RUN_ID: ${{ github.run_id }}
      shell: bash
      run: 'set -euo pipefail

        if [ "$(date -u +%s)" -lt 1793428200 ]; then exit 0; fi

        case "$FRESH_STATUS" in success|failure|cancelled) ;; *) exit 1 ;; esac

        case "$FRESH_RUN_ID" in ''''|*[!0-9]*) exit 1 ;; esac

        notice=$(printf ''%s\n'' ''@Daniel-eldick The one scheduled fresh candidate
        comparison attempt has finished.'' "Job status: $FRESH_STATUS." "Run: https://github.com/Daniel-eldick/neural-edge/actions/runs/$FRESH_RUN_ID"
        ''Private report: https://github.com/Daniel-eldick/jev-research-results/blob/reports/fresh-replay/README.md
        (owner sign-in required).'' ''Detailed results and costs remain private. A
        failure may leave evidence unavailable and the full budget hold pending; no
        paid retry or automatic lesson promotion.'')

        gh api --method POST repos/Daniel-eldick/neural-edge/issues/6/comments -f
        body="$notice" --jq .html_url

        '
