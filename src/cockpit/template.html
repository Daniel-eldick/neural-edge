@media(max-width:1200px){.workspace{padding:0 24px}.visual-grid{grid-template-columns:minmax(0,1fr) 270px;gap:16px}.main-column,.side-column{gap:16px}.secondary-grid{grid-template-columns:1fr}.progress-strip{flex-wrap:wrap;gap:12px}.progress-strip>div{flex:1}.progress-connector{display:none}.bar-plot{max-height:240px}.panel{padding:18px}}

<body>
<a class="sr-only skip-link" href="#results">Skip to cockpit</a>
<aside class="rail" aria-label="Cockpit navigation"><div class="monogram" aria-hidden="true">NE</div><nav><a href="#results" aria-label="Overview" title="Overview">▦</a><a href="#performance" aria-label="Performance charts" title="Performance charts">⌁</a><a href="#evidence" aria-label="Experiments and evidence" title="Experiments and evidence">≡</a></nav><span class="rail-bottom">PAPER RESEARCH</span></aside>
