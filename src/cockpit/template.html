<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src 'none'; base-uri 'none'; form-action 'none'">
<title>NeuralEdge · Cockpit</title>
<style>
:root{color-scheme:dark;--bg:#101918;--panel:#182321;--line:#33423d;--muted:#adbbb5;--mint:#a4e9c9;--ink:#eff5ec;--amber:#f2cc88}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{max-width:1160px;margin:auto;padding:28px 36px}header,.section-heading,.intro{display:flex;align-items:center;justify-content:space-between;gap:20px}header{border-bottom:1px solid var(--line);padding-bottom:18px}.brand{letter-spacing:.16em;font-size:13px;font-weight:700}.dot{color:var(--mint)}.snapshot{color:var(--muted);font-size:12px}.snapshot span{display:block}h1{font-size:clamp(26px,4vw,38px);font-weight:500;letter-spacing:-.035em;margin:0}h2{font-size:21px;margin:4px 0 0;font-weight:500}h3{font-size:16px;margin:0;font-weight:500}.intro{padding:28px 0}.badge{border:1px solid var(--line);border-radius:30px;padding:8px 12px;font-size:12px;white-space:nowrap;color:var(--muted)}.badge b{color:var(--ink);font-weight:500}.eyebrow{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--mint)}.period,.muted{color:var(--muted);font-size:12px}.period{text-align:right;max-width:260px}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:20px 0 0}.metrics>div{padding:20px;background:var(--panel);border:1px solid var(--line);border-radius:12px}dt{font-size:12px;color:var(--muted)}dd{font-size:30px;letter-spacing:-.035em;margin:6px 0 0;font-variant-numeric:tabular-nums}.metric-note{font-size:11px;color:var(--muted);margin:9px 0 18px}.warning{display:flex;gap:16px;align-items:center;border:1px solid #685634;border-radius:9px;background:#29271e;padding:12px 16px;margin-bottom:18px;font-size:12px;color:var(--amber)}.warning strong{white-space:nowrap}.dashboard-grid{display:grid;grid-template-columns:minmax(0,2fr) minmax(240px,1fr);gap:16px}article{padding:22px;background:var(--panel);border:1px solid var(--line);border-radius:12px;min-width:0}.balance{font-size:21px;font-variant-numeric:tabular-nums}.balance small{font-size:11px;color:var(--muted)}.performance>p{margin:4px 0 16px}svg{width:100%;height:auto;display:block}svg text{font-size:13px}.empty-chart{padding:40px 18px;border:1px dashed var(--line);border-radius:8px;color:var(--muted);font-size:13px}.milestones{list-style:none;padding:0;margin:20px 0}.milestones li{display:flex;gap:12px;align-items:center;margin:17px 0}.milestones strong{font-size:13px;font-weight:500;display:block}.milestones div>span{display:block;color:var(--muted);font-size:11px}.step{border:1px solid var(--line);border-radius:50%;width:28px;height:28px;display:grid;place-items:center;font-size:12px;flex-shrink:0;color:var(--muted)}.step.done{color:var(--mint);border-color:#608773}.step.current{color:var(--bg);background:var(--mint);border-color:var(--mint)}.next-step{border-top:1px solid var(--line);padding-top:12px;font-size:12px;margin:0}.next-step span{display:block;color:var(--muted);font-size:10px;margin-bottom:3px}.compare{margin-top:16px}.comparison{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}th,td{text-align:right;padding:13px 10px;border-bottom:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums}th:first-child,td:first-child{text-align:left;padding-left:0}thead th{font-size:11px;color:var(--muted);font-weight:400}tbody th{font-weight:500}.tag{color:var(--amber);font-size:10px;margin-left:6px}.compare>p{margin:12px 0 0}details{border-top:1px solid var(--line)}.evidence{margin-top:24px}.detail-body{padding:0 10px 16px;overflow-wrap:anywhere}.detail-body .metrics{grid-template-columns:repeat(3,minmax(0,1fr));margin-bottom:20px}.detail-body dd{font-size:18px}.detail-body li,.detail-body p{font-size:13px;color:var(--muted)}summary{cursor:pointer;min-height:48px;padding:15px 0;font-size:13px;color:var(--ink)}summary::marker{color:var(--mint)}summary:focus-visible{outline:2px solid var(--mint);outline-offset:3px}footer{color:var(--muted);font-size:11px;margin-top:24px;padding:16px 0;border-top:1px solid var(--line)}
@media(max-width:700px){main{padding:20px 16px}header{align-items:flex-start}.snapshot{text-align:right;font-size:10px}.intro{align-items:flex-start;flex-direction:column;gap:12px;padding:24px 0}.metrics{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.metrics>div{padding:16px}dd{font-size:28px}.dashboard-grid{grid-template-columns:1fr}.section-heading{gap:12px}.period{font-size:10px;max-width:150px}.warning{align-items:flex-start;flex-direction:column;gap:4px}article{padding:18px}.detail-body .metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.compare .section-heading{align-items:flex-start;flex-direction:column;gap:3px}.tag{display:block;margin:0}.balance{font-size:18px}th,td{padding:12px 8px;font-size:12px}}
</style>
</head>
<body><main>
<header><div class="brand"><span class="dot">●</span> NEURALEDGE</div><div class="snapshot">Saved snapshot<span>{{generated}}</span></div></header>
<section class="intro"><h1>Your agent, at a glance.</h1><span class="badge"><b>Research only</b> · Not live</span></section>
<section id="results" aria-label="Saved experiment results">{{runs}}</section>
<footer>Paper-only · Results update after each published test · Learning not yet measured</footer>
</main></body></html>
